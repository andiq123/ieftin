[package]
name = "ieftin-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
deunicode = "1.6.2"
dotenvy = "0.15.7"
flate2 = "1.1.11"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "derive", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
