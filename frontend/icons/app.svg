<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed app icon: a shelf price tag on a dark tile. The platform cuts the
       corners, and the tag sits inside the maskable safe zone (a circle of 40%). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14a"/>
      <stop offset="1" stop-color="#ffcc00"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g transform="rotate(-9 512 512)">
    <rect x="206" y="310" width="612" height="428" rx="104" fill="#000" opacity=".35"/>
    <rect x="206" y="292" width="612" height="428" rx="104" fill="url(#tag)"/>
    <circle cx="306" cy="506" r="36" fill="#17171a"/>
    <g fill="#1c1c1e">
      <rect x="470" y="376" width="62" height="260" rx="12"/>
      <rect x="578" y="376" width="62" height="60" rx="12"/>
      <rect x="578" y="474" width="62" height="162" rx="12"/>
    </g>
  </g>
</svg>
